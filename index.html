<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luffy TV - تحميل التطبيق</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .app-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 30px;

            display: block;
            margin: 0 auto 15px;

            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .app-name {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 45px;
            letter-spacing: 1px;
        }

        .download-box {
            display: block;
            width: 100%;
            padding: 20px 15px;
            margin: 18px 0;

            border-radius: 15px;

            text-decoration: none;
            color: white;

            font-size: 22px;
            font-weight: bold;

            background: linear-gradient(135deg, #8b0000, #e00000);

            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.25);

            transition: 0.25s ease;
        }

        .download-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(255, 0, 0, 0.4);
        }

        .download-box:active {
            transform: scale(0.97);
        }

        .download-box span {
            display: block;
            font-size: 14px;
            font-weight: normal;
            margin-top: 7px;
            opacity: 0.85;
        }

        .footer {
            margin-top: 40px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- صورة التطبيق -->
        <img
            class="app-image"
            src="https://iili.io/nUExarg.md.png"
            alt="Luffy TV"
        >

        <!-- اسم التطبيق -->
        <div class="app-name">
            Luffy TV
        </div>

        <!-- تحميل التطبيق -->
        <a
            class="download-box"
            href="https://www.mediafire.com/file/0d5t9m7x6cyka45/•Luffy+TV.apk/file"
            target="_blank"
        >
            ⬇️ تحميل التطبيق
            <span>Luffy TV</span>
        </a>

        <!-- تحميل المشغل -->
        <a
            class="download-box"
            href="https://play.google.com/store/apps/details?id=com.xpola.player"
            target="_blank"
        >
            ▶️ تحميل المشغل
            <span>XPola Player</span>
        </a>

        <!-- تحميل للشاشات -->
        <a
            class="download-box"
            href="https://play.google.com/store/apps/details?id=com.xpola.player"
            target="_blank"
        >
            للشاشات التطبيق: 3238537
            للشاشات المشغل: 8820626
            <span>للشاشات</span>
        </a>

        
        <!-- قناة التلكرام -->
        <a
            class="download-box"
            href="https://t.me/LuffyTV1"
            target="_blank"
        >
             قناة التلكرام
            <span>انضم إلى قناة Luffy TV</span>
        </a>

        <div class="footer">
            © 2026 Luffy TV
        </div>

    </div>

</body>
</html>
